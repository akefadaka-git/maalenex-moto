name: MaaleNex Android shell verification

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/scripts/android-emulator-smoke.sh"
      - ".github/workflows/android-shell-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-emulator:
    name: Android assemble, lint and emulator launch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare bounded smoke evidence directory
        run: mkdir -p artifacts/android-smoke

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend for Android asset packaging
        working-directory: frontend
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and emulator packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Enable KVM access for the emulator runner
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble APK and run Android lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Print Android lint diagnostics on failure
        if: failure()
        shell: bash
        run: |
          REPORT="android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Lint text report was not generated at $REPORT"
          fi

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-moto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch on Android 15 emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: false
          script: bash .github/scripts/android-emulator-smoke.sh

      - name: Upload bounded WebView smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maalenex-android-webview-smoke-evidence
          path: artifacts/android-smoke/
          if-no-files-found: warn
          retention-days: 14
