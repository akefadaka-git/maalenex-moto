name: A3 Passenger MVP Verification

on:
  push:
    branches:
      - feat/a3-passenger-mvp
      - integration/passenger-g1-sync-candidate

permissions:
  contents: read

jobs:
  backend-postgres:
    name: Backend, migrations and PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maalenex_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maalenex_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SYNTHETIC_DATA_ONLY: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/maalenex_dev
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and verification dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile backend
        run: python -m compileall -q app migrations tests scripts
      - name: Ruff
        run: python -m ruff check --select E4,E7,E9,F --ignore F401 app migrations tests scripts
      - name: Apply all migrations to isolated PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify Alembic metadata parity
        run: python -m alembic check
      - name: Run backend and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Verify migration downgrade and clean re-upgrade
        run: python -m alembic downgrade base && python -m alembic upgrade head

  frontend:
    name: Frontend tests, typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
