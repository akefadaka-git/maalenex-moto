<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="title desc">
  <title id="title">MaaleNex brand logo</title>
  <desc id="desc">MaaleNex wordmark with an abstract mountain M, sunrise and orbital connection motif. Amharic brand name appears beneath.</desc>
  <defs>
