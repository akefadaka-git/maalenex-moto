    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4BE0A0"/><stop offset="1" stop-color="#087D68"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49D9FF"/><stop offset="1" stop-color="#1768D9"/></linearGradient>
  </defs>
  <g transform="translate(8 7) scale(1.02)">
